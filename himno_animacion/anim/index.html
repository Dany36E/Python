<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>El Himno Nacional Mexicano</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @font-face { font-family: Fredoka; font-weight: 600; src: url(fonts/fredoka-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: Fredoka; font-weight: 700; src: url(fonts/fredoka-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: Nunito; font-weight: 700; src: url(fonts/nunito-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: Nunito; font-weight: 800; src: url(fonts/nunito-latin-800-normal.woff2) format('woff2'); }
  html, body { margin: 0; background: #1c1a24; color: #eee; font-family: Nunito, sans-serif; }
  #wrap { position: relative; width: 100vw; max-width: 177.78vh; aspect-ratio: 16 / 9; margin: 0 auto; }
  #stage { width: 100%; height: 100%; display: block; background: #fff; }
  #ui { display: flex; gap: 12px; align-items: center; justify-content: center; padding: 10px; }
  #ui button { font: 700 16px Nunito, sans-serif; padding: 8px 18px; border-radius: 999px; border: 0; background: #e94c6a; color: #fff; cursor: pointer; }
  #ui input[type=range] { width: min(60vw, 700px); }
  body.render #ui { display: none; }
  body.render #wrap { width: 1920px; height: 1080px; max-width: none; }
</style>
</head>
<body>
<div id="wrap"><svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"></svg></div>
<div id="ui">
  <button id="play">▶ Reproducir</button>
  <input id="seek" type="range" min="0" max="1" step="0.01" value="0">
  <span id="clock">0:00</span>
  <audio id="audio" src="../build/mezcla.wav" preload="auto"></audio>
</div>
<script src="timeline.js"></script>
<script src="js/lib.js"></script>
<script src="js/characters.js"></script>
<script src="js/props.js"></script>
<script src="js/scenes.js"></script>
<script src="js/main.js"></script>
</body>
</html>
