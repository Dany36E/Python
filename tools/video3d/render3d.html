<style>

<script type="module">
// Video 3D de un ejercicio: los jugadores siguen exactamente las flechas del pizarrón (o la coreografía del video).
// frameAt(ms) deja la escena como va en ese instante (determinista), para grabarla cuadro por cuadro.
import * as THREE from 'three';

const R = window.CanchaRender;
const SP = { futbol: 'Fútbol', basquet: 'Básquetbol' };
const W = 720; const H = 1280;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const angLerp = (a, b, t) => { let d = ((b - a + Math.PI) % (2 * Math.PI)) - Math.PI; if (d < -Math.PI) d += 2 * Math.PI; return a + d * t; };
const unwrap = (arr) => { for (let i = 1; i < arr.length; i++) { while (arr[i] - arr[i - 1] > Math.PI) arr[i] -= 2 * Math.PI; while (arr[i] - arr[i - 1] < -Math.PI) arr[i] += 2 * Math.PI; } return arr; };
const V2 = (x, y) => new THREE.Vector2(x, y);
const fwdOf = (h) => V2(Math.sin(h), Math.cos(h));
const rightOf = (h) => V2(-Math.cos(h), Math.sin(h));

// Velocidades (m/s) y formas de moverse
const PACE = { walk: 1.3, jog: 2.5, run: 3.6, sprint: 5.0 };
const GAIT = {
  rodillas: { speed: 1.5, stride: 0.3 }, talones: { speed: 1.7, stride: 0.36 }, saltos: { speed: 2.0, stride: 0.55 },
  carioca: { speed: 1.7, stride: 0.48, side: true }, defensivo: { speed: 1.5, stride: 0.42, side: true },
};
const LEAD = 500; const GAP = 220; const RAMP = 300;

// ---------- texturas
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
function noise(ctx, w, h, amt, seed) {
  const img = ctx.getImageData(0, 0, w, h); const d = img.data;
  let s = seed || 7;
  for (let i = 0; i < d.length; i += 4) { s = (s * 1103515245 + 12345) & 0x7fffffff; const n = ((s % 1000) / 1000 - 0.5) * amt; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  ctx.putImageData(img, 0, 0);
}
function loadSVG(svg) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });
}
const soccerTex = canvasTex(512, 256, (c, w, h) => {
  c.fillStyle = '#f4f4f2'; c.fillRect(0, 0, w, h);
  c.fillStyle = '#16161a';
  [[0.08, 0.5], [0.33, 0.25], [0.33, 0.78], [0.58, 0.5], [0.83, 0.25], [0.83, 0.78], [0.2, 0.05], [0.7, 0.05], [0.2, 0.97], [0.7, 0.97]].forEach(([x, y]) => { c.beginPath(); for (let k = 0; k < 5; k++) { const a = (k / 5) * Math.PI * 2 - Math.PI / 2; c.lineTo(x * w + Math.cos(a) * 26, y * h + Math.sin(a) * 30); } c.closePath(); c.fill(); });
});
const basketTex = canvasTex(512, 256, (c, w, h) => {
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#e2742a'); g.addColorStop(1, '#c95d17');
  c.fillStyle = g; c.fillRect(0, 0, w, h); noise(c, w, h, 18, 3);
  c.strokeStyle = '#2a1405'; c.lineWidth = 5;
  c.beginPath(); c.moveTo(0, h / 2); c.lineTo(w, h / 2); c.stroke();
  [0.25, 0.75].forEach((x) => { c.beginPath(); c.moveTo(x * w, 0); c.lineTo(x * w, h); c.stroke(); });
  c.beginPath(); c.ellipse(0, h / 2, w * 0.12, h * 0.5, 0, -Math.PI / 2, Math.PI / 2); c.stroke();
  c.beginPath(); c.ellipse(w, h / 2, w * 0.12, h * 0.5, 0, Math.PI / 2, Math.PI * 1.5); c.stroke();
});
const netTex = (rep) => canvasTex(64, 64, (c, w, h) => { c.clearRect(0, 0, w, h); c.strokeStyle = 'rgba(255,255,255,0.95)'; c.lineWidth = 3; c.strokeRect(0, 0, w, h); }, rep);
const poleTex = canvasTex(64, 256, (c, w, h) => { for (let i = 0; i < 8; i++) { c.fillStyle = i % 2 ? '#ffffff' : '#d62828'; c.fillRect(0, (i * h) / 8, w, h / 8); } });

// ---------- materiales y figuras
const mat = (color, rough, extra) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: rough == null ? 0.7 : rough, metalness: 0 }, extra || {}));
const SKINS = ['#C68642', '#8D5524', '#E0AC69', '#B97A4B', '#F1C27D', '#A5683F'];
const HAIRS = ['#22160c', '#140e08', '#3b2414', '#2b1b10'];
const KITS = {
  futbol: { a: { shirt: '#D8352A', shorts: '#F4F4F4', socks: '#D8352A', num: '#FFFFFF' }, b: { shirt: '#1F55CF', shorts: '#14204A', socks: '#1F55CF', num: '#FFFFFF' } },
  basquet: { a: { shirt: '#16264A', shorts: '#16264A', socks: '#F4F4F4', num: '#FFFFFF' }, b: { shirt: '#F4F4F4', shorts: '#F4F4F4', socks: '#F4F4F4', num: '#16264A' } },
};
const COACH = { shirt: '#3A4250', shorts: '#3A4250', socks: '#3A4250', num: '#3A4250' };
function capsule(r, len, m) { const o = new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 6, 14), m); o.castShadow = true; return o; }
function numberTex(n, ink) {
  return canvasTex(128, 128, (c, w, h) => { c.fillStyle = ink; c.font = '800 104px "Big Shoulders Display", "Arial Narrow", sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(n || ''), w / 2, h / 2 + 6); });
}

// Jugador articulado (de frente = +Z). Mide 1.48 m, como un alumno de 11 o 12 años; el profe, 1.75 m.
function makePlayer(kit, idx, n, opts) {
  opts = opts || {};
  const skin = mat(SKINS[idx % SKINS.length], 0.65);
  const shirt = mat(kit.shirt, 0.8); const shorts = mat(kit.shorts, 0.8); const socks = mat(kit.socks, 0.8);
  const shoe = mat('#1d1d20', 0.5); const hair = mat(HAIRS[idx % HAIRS.length], 0.9); const ink = mat('#1b1411', 0.6);
  const root = new THREE.Group();
  const body = new THREE.Group(); root.add(body);
  if (opts.coach) body.scale.setScalar(1.18);
  const hips = new THREE.Group(); hips.position.y = 0.78; body.add(hips);
  const pelvis = capsule(0.11, 0.08, shorts); pelvis.rotation.z = Math.PI / 2; pelvis.scale.set(1, 1, 0.8); hips.add(pelvis);
  const spine = new THREE.Group(); hips.add(spine);
  const torso = capsule(0.135, 0.26, shirt); torso.position.y = 0.25; torso.scale.set(1.08, 1, 0.78); spine.add(torso);
  if (!opts.coach) {
    const numM = new THREE.MeshStandardMaterial({ map: numberTex(n, kit.num), transparent: true, roughness: 0.8 });
    const back = new THREE.Mesh(new THREE.PlaneGeometry(0.17, 0.17), numM); back.position.set(0, 0.27, -0.112); back.rotation.y = Math.PI; spine.add(back);
    const front = new THREE.Mesh(new THREE.PlaneGeometry(0.09, 0.09), numM); front.position.set(0.05, 0.33, 0.112); spine.add(front);
  } else {
    const wh = new THREE.Mesh(new THREE.SphereGeometry(0.025, 10, 8), mat('#c9ccd2', 0.3, { metalness: 0.6 })); wh.position.set(0, 0.3, 0.12); spine.add(wh);
  }
  const neck = capsule(0.045, 0.05, skin); neck.position.y = 0.47; spine.add(neck);
  const headG = new THREE.Group(); headG.position.y = 0.6; spine.add(headG);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.1, 20, 16), skin); head.scale.set(0.92, 1.05, 1); head.castShadow = true; headG.add(head);
  // Cara sencilla: ojos, cejas y boca, para saber hacia dónde mira.
  [-1, 1].forEach((k) => {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.013, 10, 8), ink); eye.position.set(k * 0.034, 0.012, 0.088); headG.add(eye);
    const brow = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.006, 0.006), ink); brow.position.set(k * 0.034, 0.038, 0.09); headG.add(brow);
  });
  const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.034, 0.006, 0.006), mat('#7a3b2e', 0.6)); mouth.position.set(0, -0.04, 0.092); headG.add(mouth);
  const capH = new THREE.Mesh(new THREE.SphereGeometry(0.104, 20, 12, 0, Math.PI * 2, 0, Math.PI * 0.55), hair); capH.position.set(0, 0.012, -0.008); capH.scale.set(0.95, 1.05, 1.03); capH.rotation.x = -0.25; headG.add(capH);
  if (!opts.coach && idx % 3 === 1) { const tail = capsule(0.035, 0.09, hair); tail.position.set(0, -0.01, -0.12); tail.rotation.x = 0.5; headG.add(tail); }
  function arm(side) {
    const sh = new THREE.Group(); sh.position.set(side * 0.168, 0.4, 0); spine.add(sh);
    const sleeve = capsule(0.055, 0.06, shirt); sleeve.position.y = -0.05; sh.add(sleeve);
    const up = capsule(0.042, 0.16, opts.coach ? shirt : skin); up.position.y = -0.12; sh.add(up);
    const el = new THREE.Group(); el.position.y = -0.24; sh.add(el);
    const fo = capsule(0.038, 0.16, opts.coach ? shirt : skin); fo.position.y = -0.1; el.add(fo);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 10), skin); hand.position.y = -0.21; hand.castShadow = true; el.add(hand);
    return { sh, el, hand };
  }
  function leg(side) {
    const hip = new THREE.Group(); hip.position.set(side * 0.085, -0.02, 0); hips.add(hip);
    const short = capsule(0.072, 0.12, shorts); short.position.y = -0.09; hip.add(short);
    const thigh = capsule(0.058, 0.2, opts.coach ? shorts : skin); thigh.position.y = -0.2; hip.add(thigh);
    const knee = new THREE.Group(); knee.position.y = -0.37; hip.add(knee);
    const shinTop = capsule(0.05, 0.1, opts.coach ? shorts : skin); shinTop.position.y = -0.07; knee.add(shinTop);
    const sock = capsule(0.052, 0.17, socks); sock.position.y = -0.2; knee.add(sock);
    const ankle = new THREE.Group(); ankle.position.y = -0.35; knee.add(ankle);
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.065, 0.22), shoe); foot.position.set(0, -0.02, 0.05); foot.castShadow = true; ankle.add(foot);
    return { hip, knee, ankle, foot };
  }
  return { root, body, hips, spine, headG, shirt, shorts, socks, armL: arm(1), armR: arm(-1), legL: leg(1), legR: leg(-1) };
}

// Postura. phase avanza con la distancia; o.mode: idle | walk | run | dribble | fdribble | bdribble | bspeed | ladder | gather | gaits.
function pose(P, o) {
  const A = o.amp || 0; const ph = o.phase || 0;
  const legs = [[P.legL, ph, 1], [P.legR, ph + Math.PI, -1]];
  let crouch = 0.03; let lean = 0.05; let bob = 0; let twist = 0;
  P.body.rotation.set(0, 0, 0); P.body.position.set(0, 0, 0); P.hips.rotation.set(0, 0, 0);
  const setArm = (a, x, z, el) => { a.sh.rotation.set(x, 0, z); a.el.rotation.set(el, 0, 0); };
  const m = o.mode;
  if (m === 'idle' || m === 'coach') {
    const br = Math.sin(o.t * 0.0022 + o.seed) * 0.02;
    legs.forEach(([L, , k]) => { L.hip.rotation.set(-0.1, 0, k * 0.05); L.knee.rotation.x = 0.2; L.ankle.rotation.x = -0.1; });
    setArm(P.armL, 0.05 + br, 0.12, -0.35); setArm(P.armR, 0.05 - br, -0.12, -0.35);
    crouch = 0.03; lean = 0.04;
  } else if (GAIT[m] && GAIT[m].side) {
    // Desplazamiento lateral: defensivo (abre y junta, sin cruzar) o carioca (cruza por delante y por detrás).
    const c = Math.cos(ph); const s = Math.sin(ph);
    if (m === 'defensivo') {
      legs.forEach(([L, , k]) => { L.hip.rotation.set(-0.55, 0, k * (0.2 + 0.16 * c)); L.knee.rotation.x = 0.95; L.ankle.rotation.x = -0.35; });
      setArm(P.armL, -0.35, 0.95, -0.5); setArm(P.armR, -0.35, -0.95, -0.5);
      crouch = 0.2; lean = 0.32;
    } else {
      legs.forEach(([L, , k]) => { L.hip.rotation.set(-0.15 + k * 0.35 * s, 0, k * 0.08 - 0.22 * c); L.knee.rotation.x = 0.35 + 0.25 * Math.abs(s); });
      setArm(P.armL, -0.1, 0.55, -0.4); setArm(P.armR, -0.1, -0.55, -0.4);
      twist = 0.45 * s; crouch = 0.07; lean = 0.08;
    }
    bob = Math.abs(Math.sin(ph)) * 0.025;
  } else {
    // Carrera: fase de vuelo, rodilla de la pierna libre muy flexionada, brazos que pendulan desde el hombro.
    const stepLen = o.stepLen || 0.9;
    const hipAmp = m === 'rodillas' ? 0 : m === 'talones' ? 0.2 : clamp(stepLen / (Math.PI * 0.72), 0.12, 0.62);
    const kd = m === 'ladder' ? 0.5 : m === 'walk' ? 0.05 : 0.25;
    const swingK = m === 'walk' ? 0.55 : m === 'ladder' ? 1.35 : 1.05 + 0.5 * clamp((o.speed || 3) / 5, 0, 1);
    legs.forEach(([L, p, k]) => {
      const s = Math.sin(p); const c = Math.cos(p);
      let flex = s * hipAmp * A + 0.06 + A * kd * 2 * Math.max(0, s) * Math.max(0, c);
      let kn = 0.12 + swingK * A * Math.pow(Math.max(0, c), 1.3) + 0.5 * A * Math.pow(Math.max(0, -c), 2);
      if (m === 'rodillas') { flex = 1.35 * A * Math.max(0, s) + 0.05; kn = 0.2 + 1.7 * A * Math.max(0, s); }
      if (m === 'talones') { kn = 0.2 + 1.95 * A * Math.max(0, s); flex = 0.25 * s * A + 0.05; }
      const w = Math.pow(Math.max(0, -c), 2);
      L.hip.rotation.set(-flex, 0, k * 0.03); L.knee.rotation.x = kn;
      L.ankle.rotation.x = w * (flex - kn) - 0.35 * A * Math.max(0, s) * Math.max(0, c) + (m === 'ladder' ? 0.35 * w : 0);
    });
    const armAmp = (m === 'walk' ? 0.35 : m === 'ladder' || m === 'rodillas' ? 0.9 : m === 'dribble' ? 0.45 : 0.75) * (1 + 0.25 * (o.sprint || 0));
    const elb = (p) => lerp(-0.35, m === 'walk' ? -0.45 : -1.2 - 0.2 * Math.sin(p), A);
    setArm(P.armL, Math.sin(ph) * armAmp * A, m === 'dribble' ? 0.3 : 0.1, elb(ph));
    setArm(P.armR, -Math.sin(ph) * armAmp * A, m === 'dribble' ? -0.3 : -0.1, elb(ph + Math.PI));
    crouch = (m === 'dribble' || m === 'bdribble' ? 0.11 : m === 'ladder' ? 0.06 : 0.03);
    bob = 0;
    if (m === 'saltos') bob = 0.14 * A * Math.abs(Math.cos(ph));
    P.hips.rotation.y = -0.1 * A * Math.sin(ph); twist = 0.18 * A * Math.sin(ph);
    lean = (m === 'walk' ? 0.03 : 0.12 * A) + 0.14 * (o.sprint || 0) + (m === 'dribble' || m === 'bdribble' ? 0.12 : 0) + (m === 'ladder' ? 0.08 : 0);
  }
  // Toque del balón al conducir (fútbol): la pierna que toca se adelanta un instante.
  if (o.touch != null) {
    const L = o.touchLeg > 0 ? P.legL : P.legR; const k = Math.sin(clamp(o.touch, 0, 1) * Math.PI);
    L.hip.rotation.x -= 0.45 * k; L.knee.rotation.x = Math.max(0.2, L.knee.rotation.x - 0.4 * k); L.hip.rotation.z += o.touchLeg * (o.outside ? -0.35 : 0.35) * k;
  }
  // Básquetbol: la mano que bota acompaña al balón (arriba cuando el balón sube).
  if (o.dribbleHand) {
    const a = o.dribbleHand > 0 ? P.armR : P.armL; const other = o.dribbleHand > 0 ? P.armL : P.armR; const sgn = o.dribbleHand > 0 ? -1 : 1;
    const b = o.bounce || 0;
    a.sh.rotation.set(-0.45 + 0.25 * (1 - b), 0, sgn * 0.28); a.el.rotation.x = -0.35 - 0.35 * b;
    other.sh.rotation.set(-0.55, 0, -sgn * 0.55); other.el.rotation.x = -0.9; // brazo libre protege el balón
  }
  if (o.hold) { setArm(P.armL, -0.95, 0.25, -1.2); setArm(P.armR, -0.95, -0.25, -1.2); }
  if (o.target) { setArm(P.armL, -1.2, 0.3, -0.6); setArm(P.armR, -1.2, -0.3, -0.6); }
  if (o.chest != null) { const base = snapJ(P); const k = smooth(o.chest); setArm(P.armL, lerp(-0.95, -1.45, k), 0.25, lerp(-1.2, -0.1, k)); setArm(P.armR, lerp(-0.95, -1.45, k), -0.25, lerp(-1.2, -0.1, k)); lean += 0.1 * k; mixJ(P, base, smooth(o.chestW == null ? 1 : o.chestW)); }
  if (o.handoff != null) { setArm(P.armR, -1.25, -0.1, -0.3); }
  if (o.kick != null) {
    const base = snapJ(P);

window.setup = async function (id, opts) {
  opts = opts || {};
  const ex = window.CANCHA_CATALOG.exercises.find((x) => x.id === id);
  if (!ex) throw new Error('no existe ' + id);
  await document.fonts.ready;
  const ch = (window.CANCHA_CHOREO || {})[id] || {};
  const d = ch.diagram || ex.diagram;
  const v = d.v || (ex.sport === 'basquet' ? 'half' : 'full');
  const S = scalesOf(ex, d, ch);
  X = { S, center: V2(0, 0) };
  const { scene, sun, indoor } = buildScene(ex);
  await buildGround(ex, S, scene, v);
  const P = plan3d(ex, d, S, ch);
  X.P = P;
  P.gear.forEach((g) => addGear(scene, g, ex.sport));
  // Portería solo si alguien tira a ella.
  if (ex.sport === 'futbol' && P.balls.some((b) => b.segs.some((sg) => sg.type === 'goal'))) addGoal(scene, 0, (14 - 100) * S.sz, 0, 5.0);
  P.hoops.forEach((hp) => addHoop(scene, hp));
  if (indoor) addGym(scene, S);
  const kitSet = Object.assign({}, KITS[ex.sport], ch.kits || {});
  P.players.forEach((pl, k) => { pl.rig = makePlayer(kitSet[pl.team], k + (pl.team === 'b' ? 3 : 0), pl.n); pl.kit = kitSet[pl.team]; scene.add(pl.rig.root); });
  P.balls.forEach((b) => {
    b.r = ex.sport === 'basquet' ? 0.12 : 0.11;
    b.mesh = new THREE.Mesh(new THREE.SphereGeometry(b.r, 32, 20), new THREE.MeshStandardMaterial({ map: ex.sport === 'basquet' ? basketTex : soccerTex, roughness: ex.sport === 'basquet' ? 0.65 : 0.45 }));
    b.mesh.castShadow = true; scene.add(b.mesh);
  });
  // El profe y lo que grita.
  let coach = null;
  if (ch.coach) {
    coach = { rig: makePlayer(COACH, 4, '', { coach: true }), p: P.wp(ch.coach.x, ch.coach.y) };
    coach.rig.root.position.set(coach.p.x, 0, coach.p.y); scene.add(coach.rig.root);
  }
  const timeOf = (e) => { const st = P.stepT[e.s] || { t0: 0, t1: 0 }; return e.end ? st.t1 + 150 : e.at != null ? lerp(st.t0, st.t1, e.at) : st.t0; };
  const signals = (ch.signals || []).map((e) => ({ t: timeOf(e) - 250, text: e.text }));
  // Etiqueta («las traes»): toca al hombro y se cambian los chalecos.
  let tag = null;
  if (ch.tag) {
    const by = P.players.find((p) => p.key === ch.tag.by); const who = P.players.find((p) => p.key === ch.tag.who);
    if (by && who) tag = { by, who, t: timeOf({ s: ch.tag.s, end: true }) - 150 };
  }
  // Cámara
  const pts = [];
  P.players.forEach((pl) => { pts.push(pl.p0); pl.moves.forEach((m) => pts.push(m.to)); });
  P.balls.forEach((b) => { pts.push(b.p0); b.segs.forEach((sg) => { if (sg.to) pts.push(sg.to); }); });
  P.gear.forEach((g) => pts.push(g.p));
  if (coach) pts.push(coach.p);
  const ext = { x0: Infinity, x1: -Infinity, z0: Infinity, z1: -Infinity };
  pts.forEach((p) => { ext.x0 = Math.min(ext.x0, p.x); ext.x1 = Math.max(ext.x1, p.x); ext.z0 = Math.min(ext.z0, p.y); ext.z1 = Math.max(ext.z1, p.y); });
  X.center = V2((ext.x0 + ext.x1) / 2, (ext.z0 + ext.z1) / 2);
  const cam = Object.assign({}, ch.cam || {});
  const passes = P.balls.reduce((a, b) => a + b.segs.filter((sg) => sg.type === 'pass').length, 0);
  let hero = null; let heroLen = 0;
  const shooter = P.players.find((pl) => pl.acts.some((a) => a.type === 'shot'));
  P.players.forEach((pl) => { const L = pl.moves.reduce((a, m) => a + m.L, 0); if (L > heroLen) { heroLen = L; hero = pl; } });
  if (shooter && ex.sport === 'basquet') hero = shooter;
  let mode = cam.mode || (passes < 2 && heroLen >= 4.5 ? 'follow' : 'static');
  const pad = cam.pad != null ? cam.pad : 0.8;
  const ex2 = { x0: ext.x0 - pad, x1: ext.x1 + pad, z0: ext.z0 - pad, z1: ext.z1 + pad };
  const sideStatic = cam.side === 'north' ? -1 : cam.side === 'south' ? 1 : ex.sport === 'basquet' && v === 'half' ? -1 : 1;
  const camera = new THREE.PerspectiveCamera(cam.fov || 36, W / H, 0.1, 300);
  const box = { x: [-0.88, 0.88], y: [-0.62, 0.36] };
  const target0 = new THREE.Vector3(X.center.x, 0.5, X.center.y);
  function fitStatic(pitchDeg, fov, yaw) {
    camera.fov = fov; camera.updateProjectionMatrix();
    const pitch = THREE.MathUtils.degToRad(pitchDeg);
    const dir = yaw == null ? new THREE.Vector3(0, Math.sin(pitch), sideStatic * Math.cos(pitch)) : new THREE.Vector3(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch));
    const corners = [];
    [ex2.x0, ex2.x1].forEach((x) => [ex2.z0, ex2.z1].forEach((z) => [0, 1.6].forEach((y) => corners.push(new THREE.Vector3(x, y, z)))));
    let lo = 2; let hi = 150; let res = null;
    const test = (dist) => {
      camera.position.copy(target0).addScaledVector(dir, dist); camera.lookAt(target0); camera.clearViewOffset(); camera.updateMatrixWorld();
      let xa = Infinity; let xb = -Infinity; let ya = Infinity; let yb = -Infinity;
      for (const c of corners) { const q = c.clone().project(camera); xa = Math.min(xa, q.x); xb = Math.max(xb, q.x); ya = Math.min(ya, q.y); yb = Math.max(yb, q.y); }
      return { ok: xb - xa <= box.x[1] - box.x[0] && yb - ya <= box.y[1] - box.y[0], xa, xb, ya, yb };
    };
    for (let i = 0; i < 40; i++) { const mid = (lo + hi) / 2; if (test(mid).ok) hi = mid; else lo = mid; }
    res = test(hi);
    return { pos: target0.clone().addScaledVector(dir, hi), look: target0.clone(), fov, offX: (res.xa + res.xb) / 2 - (box.x[0] + box.x[1]) / 2, offY: (res.ya + res.yb) / 2 - (box.y[0] + box.y[1]) / 2, dist: hi };
  }
  let wide = fitStatic(cam.mode === 'static' ? (cam.pitch || 30) : 34, cam.mode === 'static' ? (cam.fov || 40) : 42);
  let follow = null;
  if (mode === 'follow') {
    const cycle0 = P.end + 900;
    const fx = []; const fz = []; const yaws = []; const shotW = [];
    let lastF = hero ? hero.p0.clone() : X.center.clone(); let lastYaw = null;
    const focusMode = cam.focus || 'hero';
    const ball0 = P.balls[0];
    for (let t = 0; t <= cycle0 + 1000; t += 100) {
      let f = null; let yaw = null;
      if (focusMode === 'ball' && ball0) { const bs = ballState(ball0, t, ex.sport); f = V2(bs.p.x, bs.p.z); }
      else if (hero) { const st = playerState(hero, t); f = st.p.clone(); const c = st.cur ? st.cur.c : hero.chains.find((cc) => cc.t0 > t) || null; if (c) { const a = c.pts[0]; const b = c.pts[c.pts.length - 1]; if (a.distanceTo(b) > 0.6) yaw = Math.atan2(b.x - a.x, b.y - a.y); } }
      if (focusMode === 'center') f = V2(X.center.x, f ? f.y : X.center.y);
      if (focusMode === 'ball' && ball0) { const bs1 = ballState(ball0, t + 400, ex.sport); const dv = V2(bs1.p.x - f.x, bs1.p.z - f.y); if (dv.length() > 0.3) yaw = Math.atan2(dv.x, dv.y); }
      let w = 0;
      P.balls.forEach((b) => b.segs.forEach((sg) => { if (sg.type === 'shot' && t >= sg.t0 - 1400 && t < sg.t1 + 1200) { w = 1; const sh = P.players.find((x) => x.i === sg.by); const sp = sh ? playerState(sh, t).p : f; f = V2((sp.x + sg.hoop.rim.x) / 2, (sp.y + sg.hoop.rim.y) / 2); yaw = Math.atan2(sg.hoop.rim.x - sp.x, sg.hoop.rim.y - sp.y); } }));
      if (!f) f = lastF;
      if (yaw == null) yaw = lastYaw != null ? lastYaw : (sideStatic > 0 ? Math.PI : 0);
      lastF = f; lastYaw = yaw;
      fx.push(f.x); fz.push(f.y); yaws.push(yaw); shotW.push(w);
    }
    unwrap(yaws);
    const sm = (arr, i, R2) => { let a = 0; let n = 0; for (let k = -R2; k <= R2; k++) { const w = R2 + 1 - Math.abs(k); a += arr[clamp(i + k, 0, arr.length - 1)] * w; n += w; } return a / n; };
    const at = (arr, t, R2) => { const u = t / 100; const i = Math.floor(u); return lerp(sm(arr, i, R2), sm(arr, i + 1, R2), smooth(u - i)); };
    const yawOff = THREE.MathUtils.degToRad(cam.yaw != null ? cam.yaw : 35);
    const dist = cam.dist || 6.8; const pitch = THREE.MathUtils.degToRad(cam.pitch || 17); const fov = cam.fov || 36;
    follow = (t) => {
      const sw = smooth(at(shotW, t, 6));
      const yaw = at(yaws, t, 10) + lerp(yawOff, THREE.MathUtils.degToRad(62), sw);
      const look = new THREE.Vector3(at(fx, t, 9), lerp(0.75, 1.75, sw), at(fz, t, 9));
      const dd = dist * (1 + 0.45 * sw);
      const pos = look.clone().add(new THREE.Vector3(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch)).multiplyScalar(dd));
      return { pos, look, fov: lerp(fov, fov + 6, sw), offX: 0, offY: 0.13, yaw };
    };
  }
  // La toma abierta del inicio, del mismo lado que la cámara que sigue (sin pasar por encima).
  if (follow) wide = fitStatic(34, 42, follow(1000).yaw);
  // Zancada de cada tramo (según la velocidad) y fase continua del ciclo de piernas a lo largo del recorrido.
  P.players.forEach((pl) => pl.chains.forEach((c) => { let ph = 0; c.segs.forEach((m) => { m.stride = strideOf(m); m.ph0 = ph; ph += Math.PI * m.L / m.stride; }); }));
  // Sol: sombra sobre el área de la jugada.
  const span = Math.max(ext.x1 - ext.x0, ext.z1 - ext.z0) / 2 + 4;
  sun.position.set(X.center.x - 6, 14, X.center.y + 7); sun.target.position.set(X.center.x, 0, X.center.y);
  Object.assign(sun.shadow.camera, { left: -span, right: span, top: span, bottom: -span, near: 1, far: 60 }); sun.shadow.camera.updateProjectionMatrix();
  scene.fog.near = Math.max(scene.fog.near, wide.dist * 1.3 + 6); scene.fog.far = Math.max(scene.fog.far, wide.dist * 2.6 + 30);
  // Textos
  document.getElementById('kicker').textContent = SP[ex.sport] + ' · ' + ex.objective;
  document.getElementById('title').textContent = ch.title || ex.title;
  const video = ex.video || {};
  const rawCaps = ch.captions || (video.captions && video.captions.length ? video.captions : String(ex.keyPoints || '').split('\n').filter(Boolean).slice(0, 3));
  const nSteps = Object.keys(P.stepT).length;
  const caps = rawCaps.map((c, i) => (typeof c === 'string' ? { t: i === 0 ? 0 : timeOf({ s: Object.keys(P.stepT).map(Number).sort((a, b) => a - b)[Math.min(nSteps - 1, Math.round((i * nSteps) / rawCaps.length))] }), text: c } : { t: timeOf(c), text: c.text }));
  caps.sort((a, b) => a.t - b.t); if (caps.length) caps[0].t = 0;
  document.getElementById('reps').textContent = video.reps || (ex.duration + ' min');
  document.getElementById('v').classList.toggle('bare', !!opts.bare);
  const cycle = P.end + 700;
  const total = cycle * (cycle >= 8500 ? 1 : 2);
  let thumb = P.end * 0.45;
  if (hero && hero.chains.length) { const c = hero.chains[0]; thumb = c.t0 + (c.t1 - c.t0) * 0.6; }
  Object.assign(X, { ex, P, scene, camera, wide, follow, caps, cycle, total, coach, signals, tag, sideStatic, mode });
  return { total, cycle, poster: Math.min(P.end - 150, cycle - 1), thumb };
};

window.frameAt = function (ms) {
  const { P, camera, wide, follow, caps, cycle, total, ex, coach, signals, tag } = X;
  const t = ms % cycle;
  // Cámara: toma abierta al inicio y luego sigue la acción (o fija toda la jugada).
  let C = wide;
  if (follow) {
    const f = follow(t); const k = smooth((t - 900) / 1300);
    C = { pos: wide.pos.clone().lerp(f.pos, k), look: wide.look.clone().lerp(f.look, k), fov: lerp(wide.fov, f.fov, k), offX: lerp(wide.offX, f.offX, k), offY: lerp(wide.offY, f.offY, k) };
  }
  const breathe = 1 - 0.0175 * (1 - Math.cos((ms / total) * Math.PI * 2));
  camera.position.copy(C.look).add(C.pos.clone().sub(C.look).multiplyScalar(breathe));
  camera.fov = C.fov; camera.updateProjectionMatrix();
  camera.lookAt(C.look);
  camera.setViewOffset(W, H, C.offX * W / 2, -C.offY * H / 2, W, H);
  camera.updateMatrixWorld();
  // Jugadores
  P.players.forEach((pl, k) => {
    const st = playerState(pl, t);
    const h = headingOf(pl, t);
    pl.rig.root.position.set(st.p.x, 0, st.p.y);
    pl.rig.root.rotation.y = h;
    const o = { t, seed: k * 1.7, mode: 'idle', amp: 0, phase: 0 };
    if (st.cur) {
      const m = st.cur.m;
      o.mode = m.mode === 'fdribble' ? 'dribble' : m.mode === 'bspeed' ? 'run' : m.mode === 'gather' ? 'run' : m.mode;
      const tt = t - st.cur.c.t0; const rem = st.cur.c.t1 - t;
      o.amp = clamp(Math.min(tt / 260, rem / 260, 1), 0, 1);
      o.sprint = m.sprint || (m.mode === 'bspeed' ? 0.6 : 0);
      o.speed = m.speed; o.stepLen = m.stride || strideOf(m);
      if (m.ladder) o.mode = 'ladder';
      o.phase = (m.ph0 || 0) + Math.PI * (st.cur.d - m.d0) / (m.stride || strideOf(m));
      // Se inclina hacia adentro en las curvas.
      if (!(GAIT[m.mode] && GAIT[m.mode].side)) { const h1 = headingOf(pl, t - 60); const h2 = headingOf(pl, t + 60); let dw = h2 - h1; while (dw > Math.PI) dw -= 2 * Math.PI; while (dw < -Math.PI) dw += 2 * Math.PI; o.roll = clamp(-Math.atan((m.speed * dw / 0.12) / 9.8) * 0.8, -0.4, 0.4) * o.amp; }
      m.hops.forEach((u) => { const dk = st.cur.u - u; const w = 0.6 / Math.max(0.6, m.L); if (Math.abs(dk) < w) { const q = 1 - Math.abs(dk) / w; o.hop = Math.sin(q * Math.PI / 2); o.lift = Math.sin((dk / w + 1) * Math.PI / 2) * 0.32; } });
    }
    if (st.hold) { o.pose = st.hold.pose; o.mode = 'idle'; }
    pl.acts.forEach((a) => {
      const sg = a.seg;
      if (sg.type === 'pass' || sg.type === 'goal') { if (ex.sport === 'futbol') { const r = (t - (sg.t0 - 290)) / 420; if (r >= 0 && r <= 1.4) o.kick = r; } else { const r = (t - (sg.t0 - 260)) / 380; if (r >= 0 && r <= 1) o.chest = r < 0.65 ? r / 0.65 : 1 - (r - 0.65) / 0.35 * 0.3; } }
      if (sg.type === 'handoff') { const r = (t - (sg.t0 - 200)) / 500; if (r >= 0 && r <= 1) o.handoff = r; }
      if (sg.type === 'shot') {
        if (sg.layup) {
          const r = (t - sg.jumpT) / 650; if (r >= 0 && r <= 1) { o.layup = Math.sin(r * Math.PI); o.layupLeg = sg.hand; o.lift = Math.sin(r * Math.PI) * 0.42; o.shoot = clamp(r * 1.3, 0, 1) * 1.0; o.shootHand = sg.hand; }
          else if (t >= sg.gather.a0 && t < sg.jumpT) o.hold = true;
        } else { const r = (t - (sg.t0 - 520)) / 820; if (r >= 0 && r <= 1.15) { o.shoot = clamp(r, 0, 1); o.shootHand = 1; o.lift = Math.sin(clamp(r, 0, 1) * Math.PI) * 0.15; } }
      }
    });
    pl.recv.forEach((rv) => { const sg = rv.seg; if (ex.sport === 'futbol') { const r = (t - (sg.t1 - 180)) / 420; if (r >= 0 && r <= 1 && !st.cur) o.receive = r; } else if (t > sg.t1 - 380 && t < sg.t1 && !st.cur) o.target = true; });
    if (tag && pl === tag.by) { const r = (t - (tag.t - 250)) / 600; if (r >= 0 && r <= 1) o.tagArm = r; }
    pl.rig.state = o;
    // Chalecos que cambian de dueño en «las traes»
    if (tag && (pl === tag.by || pl === tag.who)) { const swapped = t >= tag.t + 250; const kit = swapped ? (pl === tag.by ? tag.who.kit : tag.by.kit) : pl.kit; pl.rig.shirt.color.set(kit.shirt); }
  });
  // Balones (después de saber qué hace cada jugador)
  P.balls.forEach((b) => {
    const bs = ballState(b, t, ex.sport);
    b.mesh.visible = bs.visible;
    b.mesh.position.copy(bs.p);
    b.mesh.rotation.set(bs.spin || 0, 0.4, 0);
    if (bs.carry) {
      const pl = P.players.find((x) => x.i === bs.carry.by);
      if (ex.sport === 'basquet') { pl.rig.state.dribbleHand = bs.c.side >= 0 ? 1 : -1; pl.rig.state.bounce = bs.c.bounce; }
      else if (bs.c.touch != null) { pl.rig.state.touch = bs.c.touch; pl.rig.state.touchLeg = bs.c.touchLeg; pl.rig.state.outside = bs.c.outside; }
    }
    if (bs.held && !bs.held.rig.state.shoot && !bs.held.rig.state.chest && !bs.held.rig.state.handoff) bs.held.rig.state.hold = true;
  });
  P.players.forEach((pl) => pose(pl.rig, pl.rig.state));
  // El profe: mira a los alumnos y levanta la mano cuando grita.
  const sigNow = signals.find((s) => t >= s.t && t < s.t + 900);
  if (coach) {
    const c = X.center; coach.rig.root.rotation.y = Math.atan2(c.x - coach.p.x, c.y - coach.p.y);
    const s2 = signals.find((s) => t >= s.t - 100 && t < s.t + 900);
    pose(coach.rig, { t, seed: 3, mode: 'coach', signal: s2 ? (t - s2.t + 100) / 1000 : null });
  }
  renderer.render(X.scene, camera);
  // Textos: título que se achica, frase del paso y lo que grita el profe.
  document.getElementById('v').classList.toggle('small', t > 2600);
  let ci = 0; for (let i = 0; i < caps.length; i++) if (t >= caps[i].t) ci = i;
  const cap = document.getElementById('cap');
  cap.textContent = caps[ci] ? caps[ci].text : '';
  cap.parentNode.style.display = caps[ci] ? '' : 'none';
  const since = t - (caps[ci] ? caps[ci].t : 0);
  cap.style.opacity = String(Math.min(1, since / 220));
  cap.style.transform = 'translateY(' + Math.max(0, 12 - since / 18) + 'px)';
  const sig = document.getElementById('sig');
  if (sigNow) { const k = (t - sigNow.t) / 900; sig.textContent = sigNow.text; sig.style.opacity = String(k < 0.75 ? 1 : (1 - k) * 4); sig.style.transform = 'scale(' + (0.7 + 0.3 * smooth(k * 4)) + ')'; } else sig.textContent = '';
};
window.ready3d = true;
</script>
