<script type="module">
// Video 3D de un ejercicio: los jugadores siguen exactamente las flechas del pizarrón (o la coreografía del video).
// frameAt(ms) deja la escena como va en ese instante (determinista), para grabarla cuadro por cuadro.
import * as THREE from 'three';

const R = window.CanchaRender;
const SP = { futbol: 'Fútbol', basquet: 'Básquetbol' };
const W = 720; const H = 1280;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const angLerp = (a, b, t) => { let d = ((b - a + Math.PI) % (2 * Math.PI)) - Math.PI; if (d < -Math.PI) d += 2 * Math.PI; return a + d * t; };
const unwrap = (arr) => { for (let i = 1; i < arr.length; i++) { while (arr[i] - arr[i - 1] > Math.PI) arr[i] -= 2 * Math.PI; while (arr[i] - arr[i - 1] < -Math.PI) arr[i] += 2 * Math.PI; } return arr; };
const V2 = (x, y) => new THREE.Vector2(x, y);
const fwdOf = (h) => V2(Math.sin(h), Math.cos(h));
const rightOf = (h) => V2(-Math.cos(h), Math.sin(h));

// Velocidades (m/s) y formas de moverse
const PACE = { walk: 1.3, jog: 2.5, run: 3.6, sprint: 5.0 };
const GAIT = {
  rodillas: { speed: 1.1, stride: 0.36 }, talones: { speed: 1.2, stride: 0.4 }, saltos: { speed: 2.0, stride: 0.55 },
  carioca: { speed: 1.5, stride: 0.48, side: true }, defensivo: { speed: 1.35, stride: 0.45, side: true },
};
const GAP = 220; const RAMP = 300;
// Cámara: toma alta fija (OPEN), bajada (DESC), al final sube (RISE), se queda (STAY) y se funde con el inicio (FADE).
const OPEN = 2600; const DESC = 1800; const RISE = 1300; const STAY = 300; const FADE = 440;

// ---------- texturas
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
function noise(ctx, w, h, amt, seed) {
  const img = ctx.getImageData(0, 0, w, h); const d = img.data;
  let s = seed || 7;
  for (let i = 0; i < d.length; i += 4) { s = (s * 1103515245 + 12345) & 0x7fffffff; const n = ((s % 1000) / 1000 - 0.5) * amt; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  ctx.putImageData(img, 0, 0);
}
function loadSVG(svg) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });
}
const soccerTex = canvasTex(512, 256, (c, w, h) => {
  c.fillStyle = '#f4f4f2'; c.fillRect(0, 0, w, h);
  c.fillStyle = '#16161a';
  [[0.08, 0.5], [0.33, 0.25], [0.33, 0.78], [0.58, 0.5], [0.83, 0.25], [0.83, 0.78], [0.2, 0.05], [0.7, 0.05], [0.2, 0.97], [0.7, 0.97]].forEach(([x, y]) => { c.beginPath(); for (let k = 0; k < 5; k++) { const a = (k / 5) * Math.PI * 2 - Math.PI / 2; c.lineTo(x * w + Math.cos(a) * 26, y * h + Math.sin(a) * 30); } c.closePath(); c.fill(); });
});
const basketTex = canvasTex(512, 256, (c, w, h) => {
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#e2742a'); g.addColorStop(1, '#c95d17');
  c.fillStyle = g; c.fillRect(0, 0, w, h); noise(c, w, h, 18, 3);
  c.strokeStyle = '#2a1405'; c.lineWidth = 5;
  c.beginPath(); c.moveTo(0, h / 2); c.lineTo(w, h / 2); c.stroke();
  [0.25, 0.75].forEach((x) => { c.beginPath(); c.moveTo(x * w, 0); c.lineTo(x * w, h); c.stroke(); });
  c.beginPath(); c.ellipse(0, h / 2, w * 0.12, h * 0.5, 0, -Math.PI / 2, Math.PI / 2); c.stroke();
  c.beginPath(); c.ellipse(w, h / 2, w * 0.12, h * 0.5, 0, Math.PI / 2, Math.PI * 1.5); c.stroke();
});
const netTex = (rep) => canvasTex(64, 64, (c, w, h) => { c.clearRect(0, 0, w, h); c.strokeStyle = 'rgba(255,255,255,0.95)'; c.lineWidth = 3; c.strokeRect(0, 0, w, h); }, rep);
const poleTex = canvasTex(64, 256, (c, w, h) => { for (let i = 0; i < 8; i++) { c.fillStyle = i % 2 ? '#ffffff' : '#d62828'; c.fillRect(0, (i * h) / 8, w, h / 8); } });

// ---------- materiales y figuras
const mat = (color, rough, extra) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: rough == null ? 0.7 : rough, metalness: 0 }, extra || {}));
const SKINS = ['#C68642', '#8D5524', '#E0AC69', '#B97A4B', '#F1C27D', '#A5683F'];
const HAIRS = ['#22160c', '#140e08', '#3b2414', '#2b1b10'];
const KITS = {
  futbol: { a: { shirt: '#D8352A', shorts: '#F4F4F4', socks: '#D8352A', num: '#FFFFFF' }, b: { shirt: '#1F55CF', shorts: '#14204A', socks: '#1F55CF', num: '#FFFFFF' } },
  basquet: { a: { shirt: '#1E63E0', shorts: '#14336F', socks: '#F4F4F4', num: '#FFFFFF' }, b: { shirt: '#F4F4F4', shorts: '#F4F4F4', socks: '#F4F4F4', num: '#14336F' } },
};
const COACH = { shirt: '#3A4250', shorts: '#3A4250', socks: '#3A4250', num: '#3A4250' };
function capsule(r, len, m) { const o = new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 6, 14), m); o.castShadow = true; return o; }
function numberTex(n, ink) {
  return canvasTex(128, 128, (c, w, h) => { c.fillStyle = ink; c.font = '800 104px "Big Shoulders Display", "Arial Narrow", sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(n || ''), w / 2, h / 2 + 6); });
}

// Jugador articulado (de frente = +Z). Mide 1.48 m, como un alumno de 11 o 12 años; el profe, 1.75 m.
function makePlayer(kit, idx, n, opts) {
  opts = opts || {};
  const skin = mat(SKINS[idx % SKINS.length], 0.65);
  const shirt = mat(kit.shirt, 0.8); const shorts = mat(kit.shorts, 0.8); const socks = mat(kit.socks, 0.8);
  const shoe = mat('#1d1d20', 0.5); const hair = mat(HAIRS[idx % HAIRS.length], 0.9); const ink = mat('#1b1411', 0.6);
  const root = new THREE.Group();
  const body = new THREE.Group(); root.add(body);
  if (opts.coach) body.scale.setScalar(1.18);
  const hips = new THREE.Group(); hips.position.y = 0.78; body.add(hips);
  const pelvis = capsule(0.11, 0.08, shorts); pelvis.rotation.z = Math.PI / 2; pelvis.scale.set(1, 1, 0.8); hips.add(pelvis);
  const spine = new THREE.Group(); hips.add(spine);
  const torso = capsule(0.135, 0.26, shirt); torso.position.y = 0.25; torso.scale.set(1.08, 1, 0.78); spine.add(torso);
  if (!opts.coach) {
    const numM = new THREE.MeshStandardMaterial({ map: numberTex(n, kit.num), transparent: true, roughness: 0.8 });
    const back = new THREE.Mesh(new THREE.PlaneGeometry(0.17, 0.17), numM); back.position.set(0, 0.27, -0.112); back.rotation.y = Math.PI; spine.add(back);
    const front = new THREE.Mesh(new THREE.PlaneGeometry(0.09, 0.09), numM); front.position.set(0.05, 0.33, 0.112); spine.add(front);
  } else {
    const wh = new THREE.Mesh(new THREE.SphereGeometry(0.025, 10, 8), mat('#c9ccd2', 0.3, { metalness: 0.6 })); wh.position.set(0, 0.3, 0.12); spine.add(wh);
  }
  const neck = capsule(0.045, 0.05, skin); neck.position.y = 0.47; spine.add(neck);
  const headG = new THREE.Group(); headG.position.y = 0.6; spine.add(headG);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.1, 20, 16), skin); head.scale.set(0.92, 1.05, 1); head.castShadow = true; headG.add(head);
  // Cara sencilla: ojos, cejas y boca, para saber hacia dónde mira.
  [-1, 1].forEach((k) => {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.013, 10, 8), ink); eye.position.set(k * 0.034, 0.012, 0.088); headG.add(eye);
    const brow = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.006, 0.006), ink); brow.position.set(k * 0.034, 0.038, 0.09); headG.add(brow);
  });
  const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.034, 0.006, 0.006), mat('#7a3b2e', 0.6)); mouth.position.set(0, -0.04, 0.092); headG.add(mouth);
  const capH = new THREE.Mesh(new THREE.SphereGeometry(0.104, 20, 12, 0, Math.PI * 2, 0, Math.PI * 0.55), hair); capH.position.set(0, 0.012, -0.008); capH.scale.set(0.95, 1.05, 1.03); capH.rotation.x = -0.25; headG.add(capH);
  if (!opts.coach && idx % 3 === 1) { const tail = capsule(0.035, 0.09, hair); tail.position.set(0, -0.01, -0.12); tail.rotation.x = 0.5; headG.add(tail); }
  function arm(side) {
    const sh = new THREE.Group(); sh.position.set(side * 0.168, 0.4, 0); spine.add(sh);
    const sleeve = capsule(0.055, 0.06, shirt); sleeve.position.y = -0.05; sh.add(sleeve);
    const up = capsule(0.042, 0.16, opts.coach ? shirt : skin); up.position.y = -0.12; sh.add(up);
    const el = new THREE.Group(); el.position.y = -0.24; sh.add(el);
    const fo = capsule(0.038, 0.16, opts.coach ? shirt : skin); fo.position.y = -0.1; el.add(fo);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 10), skin); hand.position.y = -0.21; hand.castShadow = true; el.add(hand);
    return { sh, el, hand };
  }
  function leg(side) {
    const hip = new THREE.Group(); hip.position.set(side * 0.085, -0.02, 0); hips.add(hip);
    const short = capsule(0.072, 0.12, shorts); short.position.y = -0.09; hip.add(short);
    const thigh = capsule(0.058, 0.2, opts.coach ? shorts : skin); thigh.position.y = -0.2; hip.add(thigh);
    const knee = new THREE.Group(); knee.position.y = -0.37; hip.add(knee);
    const shinTop = capsule(0.05, 0.1, opts.coach ? shorts : skin); shinTop.position.y = -0.07; knee.add(shinTop);
    const sock = capsule(0.052, 0.17, socks); sock.position.y = -0.2; knee.add(sock);
    const ankle = new THREE.Group(); ankle.position.y = -0.35; knee.add(ankle);
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.065, 0.22), shoe); foot.position.set(0, -0.02, 0.05); foot.castShadow = true; ankle.add(foot);
    return { hip, knee, ankle, foot };
  }
  return { root, body, hips, spine, headG, shirt, shorts, socks, armL: arm(1), armR: arm(-1), legL: leg(1), legR: leg(-1) };
}

// Postura. Las piernas se resuelven por IK sobre los apoyos (o.feet, en coordenadas del cuerpo) y o.hy es la altura de la cadera.
// o.mode decide brazos y tronco: idle | coach | walk | run | dribble | bdribble | lad | rodillas | talones | defensivo | carioca.
function pose(P, o) {
  const A = o.amp || 0; const ph = o.phase || 0;
  const legs = [[P.legL, 1], [P.legR, -1]];
  let lean = 0.05; let twist = 0;
  P.body.rotation.set(0, 0, 0); P.body.position.set(0, 0, 0); P.hips.rotation.set(0, 0, 0); P.headG.rotation.set(0, 0, 0);
  P.legL.ankle.rotation.set(0, 0, 0); P.legR.ankle.rotation.set(0, 0, 0);
  const setArm = (a, x, z, el) => { a.sh.rotation.set(x, 0, z); a.el.rotation.set(el, 0, 0); };
  const m = o.mode; const dr = /dribble/.test(m || '');
  let hy = o.hy != null ? o.hy : 0.782; let override = false;
  // Tronco y brazos según el movimiento.
  if (m === 'idle' || m === 'coach' || !m) {
    const br = Math.sin(o.t * 0.0022 + o.seed) * 0.02;
    setArm(P.armL, 0.05 + br, 0.12, -0.35); setArm(P.armR, 0.05 - br, -0.12, -0.35); lean = 0.04;
  } else if (m === 'lad') {
    const s = Math.cos(o.armPh || 0) * 0.7;
    setArm(P.armL, s - 0.15, 0.12, -1.5); setArm(P.armR, -s - 0.15, -0.12, -1.5);
    lean = 0.17; twist = -0.12 * Math.cos(o.armPh || 0);
  } else if (m === 'defensivo') {
    setArm(P.armL, -0.35, 0.95, -0.5); setArm(P.armR, -0.35, -0.95, -0.5); lean = 0.3;
  } else if (m === 'carioca') {
    setArm(P.armL, -0.1, 0.85, -0.3); setArm(P.armR, -0.1, -0.85, -0.3); lean = 0.05;
    P.hips.rotation.y = o.hipYaw || 0; twist = -(o.hipYaw || 0) * 0.85;
  } else {
    const armAmp = (m === 'walk' ? 0.35 : m === 'rodillas' ? 0.95 : m === 'talones' ? 0.55 : dr ? 0.45 : 0.75) * (1 + 0.25 * (o.sprint || 0));
    const elb = (p) => lerp(-0.35, m === 'walk' ? -0.45 : -1.45 - 0.15 * Math.sin(p), A);
    setArm(P.armL, Math.sin(ph) * armAmp * A, dr ? 0.3 : 0.1, elb(ph));
    setArm(P.armR, -Math.sin(ph) * armAmp * A, dr ? -0.3 : -0.1, elb(ph + Math.PI));
    P.hips.rotation.y = -0.12 * A * Math.sin(ph); twist = 0.16 * A * Math.sin(ph);
    lean = (m === 'walk' ? 0.03 : 0.1 * A) + 0.14 * (o.sprint || 0) + (dr ? 0.1 : 0) - (m === 'rodillas' ? 0.05 : 0);
  }
  // Piernas: IK sobre los apoyos (en el marco de la cadera, que puede ir girada).
  if (o.feet) {
    const yaw = P.hips.rotation.y; const cy = Math.cos(-yaw); const sy = Math.sin(-yaw);
    const rot = (q) => ({ x: q.x * cy + q.z * sy, z: -q.x * sy + q.z * cy, y: q.y, pitch: q.pitch });
    legIK(P.legL, 1, hy, rot(o.feet.L)); legIK(P.legR, -1, hy, rot(o.feet.R));
  } else {
    legs.forEach(([L, k]) => { L.hip.rotation.set(-0.06, 0, k * 0.05); L.knee.rotation.x = 0.12; L.ankle.rotation.x = -0.06; });
    hy = 0.79; override = true;
  }
  if (o.touchYaw) P.legR.ankle.rotation.y = o.touchYaw;
  // Básquetbol: la mano que bota acompaña al balón (arriba cuando el balón sube).
  if (o.dribbleHand) {
    const a = o.dribbleHand > 0 ? P.armR : P.armL; const other = o.dribbleHand > 0 ? P.armL : P.armR; const sgn = o.dribbleHand > 0 ? -1 : 1;
    const b = o.bounce || 0;
    a.sh.rotation.set(-0.45 + 0.25 * (1 - b), 0, sgn * 0.28); a.el.rotation.x = -0.35 - 0.35 * b;
    if (o.speedy) { const s = Math.sin(ph) * 0.5 * A; other.sh.rotation.set(sgn > 0 ? -s - 0.1 : s - 0.1, 0, -sgn * 0.2); other.el.rotation.x = -1.3; }
    else { other.sh.rotation.set(-0.55, 0, -sgn * 0.55); other.el.rotation.x = -0.9; }
  }
  if (o.hold) { const base = snapJ(P); setArm(P.armL, -0.95, 0.25, -1.2); setArm(P.armR, -0.95, -0.25, -1.2); if (o.holdW != null && o.holdW < 1) mixJ(P, base, o.holdW); }
  if (o.reach) { const base = snapJ(P); setArm(P.armL, -2.5, 0.35, -0.5); setArm(P.armR, -2.5, -0.35, -0.5); mixJ(P, base, o.reach); }
  if (o.target) { setArm(P.armL, -1.2, 0.3, -0.6); setArm(P.armR, -1.2, -0.3, -0.6); }
  if (o.catchHigh) { setArm(P.armL, -2.5, 0.35, -0.5); setArm(P.armR, -2.5, -0.35, -0.5); }
  if (o.chest != null) { const base = snapJ(P); const k = smooth(o.chest); setArm(P.armL, lerp(-0.95, -1.45, k), 0.25, lerp(-1.2, -0.1, k)); setArm(P.armR, lerp(-0.95, -1.45, k), -0.25, lerp(-1.2, -0.1, k)); lean += 0.1 * k; mixJ(P, base, 1); }
  if (o.handoff != null) { const k = Math.sin(clamp(o.handoff, 0, 1) * Math.PI); setArm(P.armR, lerp(-0.9, -1.3, k), -0.1, lerp(-1.1, -0.3, k)); }
  let kickHy = null; let kickW = 0;
  if (o.kick != null) {
    // Pase con el interior: pie de apoyo junto al balón, armado corto, golpe con el tobillo firme y el pie abierto, y acompaña.
    const base = snapJ(P);

const smoother = (t) => { t = clamp(t, 0, 1); return t * t * t * (t * (t * 6 - 15) + 10); };

function drawScene(t) {

window.frameAt = function (ms) {
